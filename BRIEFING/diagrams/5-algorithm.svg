<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="620" fill="#f7f9fc"/>
  <text x="500" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#1a2b4a">How the Dispatcher Decides</text>
  <text x="500" y="60" text-anchor="middle" font-size="14" fill="#5a6b85">Search a tree of possible stop-orders - commit the best one as a stack - replan on new info</text>

  <!-- ===== LEFT: the search tree ===== -->
  <text x="235" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#5a3d99">1 - SEARCH the tree</text>
  <text x="235" y="116" text-anchor="middle" font-size="11" fill="#7a6a95">node = state (car pos, aboard, waiting, time-so-far)</text>
  <text x="235" y="131" text-anchor="middle" font-size="11" fill="#7a6a95">branch = "serve this floor next"</text>

  <!-- root -->
  <circle cx="235" cy="160" r="16" fill="#6b4ea8"/>
  <text x="235" y="165" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">now</text>

  <!-- level 1 -->
  <line x1="223" y1="172" x2="140" y2="212" stroke="#b9a4dd" stroke-width="1.5"/>
  <line x1="235" y1="176" x2="235" y2="212" stroke="#1aa89a" stroke-width="2.5"/>
  <line x1="247" y1="172" x2="335" y2="212" stroke="#d98a8a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="140" cy="226" r="15" fill="#efe9f8" stroke="#6b4ea8" stroke-width="1.5"/><text x="140" y="230" text-anchor="middle" font-size="10" fill="#5a3d99">f5</text>
  <circle cx="235" cy="226" r="15" fill="#1aa89a"/><text x="235" y="230" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">f3</text>
  <g><circle cx="335" cy="226" r="15" fill="#fbeaea" stroke="#d98a8a" stroke-width="1.5"/><text x="335" y="230" text-anchor="middle" font-size="10" fill="#b05555">f9</text>
     <line x1="325" y1="216" x2="345" y2="236" stroke="#d98a8a" stroke-width="1.5"/><line x1="345" y1="216" x2="325" y2="236" stroke="#d98a8a" stroke-width="1.5"/></g>

  <!-- level 2 -->
  <line x1="130" y1="239" x2="95" y2="280" stroke="#b9a4dd" stroke-width="1.5"/>
  <line x1="150" y1="239" x2="180" y2="280" stroke="#b9a4dd" stroke-width="1.5"/>
  <line x1="235" y1="241" x2="235" y2="280" stroke="#1aa89a" stroke-width="2.5"/>
  <circle cx="95" cy="294" r="14" fill="#efe9f8" stroke="#6b4ea8" stroke-width="1.5"/><text x="95" y="298" text-anchor="middle" font-size="9" fill="#5a3d99">f12</text>
  <circle cx="180" cy="294" r="14" fill="#efe9f8" stroke="#6b4ea8" stroke-width="1.5"/><text x="180" y="298" text-anchor="middle" font-size="9" fill="#5a3d99">f8</text>
  <circle cx="235" cy="294" r="14" fill="#1aa89a"/><text x="235" y="298" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">f17</text>

  <!-- level 3 on the chosen path -->
  <line x1="235" y1="308" x2="235" y2="344" stroke="#1aa89a" stroke-width="2.5"/>
  <circle cx="235" cy="358" r="14" fill="#1aa89a"/><text x="235" y="362" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">f12</text>

  <!-- prune key -->
  <text x="372" y="250" font-size="10.5" fill="#b05555">x pruned:</text>
  <text x="372" y="265" font-size="10" fill="#b05555">over capacity,</text>
  <text x="372" y="279" font-size="10" fill="#b05555">or lets someone</text>
  <text x="372" y="293" font-size="10" fill="#b05555">go overdue.</text>

  <text x="235" y="398" text-anchor="middle" font-size="11" fill="#0f766e" font-weight="700">green = best surviving path</text>

  <!-- ===== arrow ===== -->
  <line x1="440" y1="280" x2="520" y2="280" stroke="#2f6db0" stroke-width="3" marker-end="url(#a)"/>
  <text x="480" y="270" text-anchor="middle" font-size="11" font-weight="700" fill="#245a94">extract</text>

  <!-- ===== RIGHT: the stack ===== -->
  <text x="650" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">2 - COMMIT as a stack</text>
  <text x="650" y="116" text-anchor="middle" font-size="11" fill="#5a8079">the chosen path = the car's plan</text>

  <g>
    <rect x="575" y="140" width="150" height="34" rx="5" fill="#1aa89a"/>
    <text x="650" y="162" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">f3  (next)  &#8592; GO NOW</text>
    <rect x="575" y="180" width="150" height="34" rx="5" fill="#8fd0c8"/>
    <text x="650" y="202" text-anchor="middle" font-size="12" fill="#063b36">f17</text>
    <rect x="575" y="220" width="150" height="34" rx="5" fill="#8fd0c8"/>
    <text x="650" y="242" text-anchor="middle" font-size="12" fill="#063b36">f12</text>
    <rect x="575" y="260" width="150" height="34" rx="5" fill="#cdeae6"/>
    <text x="650" y="282" text-anchor="middle" font-size="11" fill="#2a6a62">...rest (replaceable)</text>
  </g>
  <text x="650" y="318" text-anchor="middle" font-size="10.5" fill="#5a8079">commit only the FIRST step;</text>
  <text x="650" y="333" text-anchor="middle" font-size="10.5" fill="#5a8079">re-search for the next one</text>

  <!-- ===== BOTTOM: the gists ===== -->
  <line x1="40" y1="430" x2="960" y2="430" stroke="#d7dee8" stroke-width="1.5"/>
  <text x="500" y="455" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2b4a">The rules that shape the search</text>

  <g>
    <rect x="40" y="470" width="220" height="110" rx="10" fill="#eef7f5" stroke="#1aa89a" stroke-width="1.5"/>
    <text x="150" y="492" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f766e">OBJECTIVE</text>
    <text x="150" y="514" text-anchor="middle" font-size="11.5" fill="#2a6a62">minimise AVERAGE wait</text>
    <text x="150" y="531" text-anchor="middle" font-size="11.5" fill="#2a6a62">(time from request</text>
    <text x="150" y="546" text-anchor="middle" font-size="11.5" fill="#2a6a62">to pickup)</text>
    <text x="150" y="568" text-anchor="middle" font-size="10" fill="#5a8079" font-style="italic">the graded metric</text>
  </g>
  <g>
    <rect x="275" y="470" width="220" height="110" rx="10" fill="#fdf1e7" stroke="#e07b2a" stroke-width="1.5"/>
    <text x="385" y="492" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b2560f">FAIRNESS guard</text>
    <text x="385" y="514" text-anchor="middle" font-size="11.5" fill="#8a5a2a">a max-time ceiling: if a</text>
    <text x="385" y="531" text-anchor="middle" font-size="11.5" fill="#8a5a2a">request nears it, serving</text>
    <text x="385" y="546" text-anchor="middle" font-size="11.5" fill="#8a5a2a">it is FORCED next</text>
    <text x="385" y="568" text-anchor="middle" font-size="10" fill="#9a6a3a" font-style="italic">no one starves</text>
  </g>
  <g>
    <rect x="510" y="470" width="220" height="110" rx="10" fill="#eef4fb" stroke="#2f6db0" stroke-width="1.5"/>
    <text x="620" y="492" text-anchor="middle" font-size="12.5" font-weight="700" fill="#245a94">SLACK</text>
    <text x="620" y="514" text-anchor="middle" font-size="11.5" fill="#3a5f87">spare time before a</text>
    <text x="620" y="531" text-anchor="middle" font-size="11.5" fill="#3a5f87">request's ceiling. High</text>
    <text x="620" y="546" text-anchor="middle" font-size="11.5" fill="#3a5f87">slack = can detour/chain</text>
    <text x="620" y="568" text-anchor="middle" font-size="10" fill="#51708f" font-style="italic">drives pruning order</text>
  </g>
  <g>
    <rect x="745" y="470" width="215" height="110" rx="10" fill="#efe9f8" stroke="#6b4ea8" stroke-width="1.5"/>
    <text x="852" y="492" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5a3d99">NO STALLING</text>
    <text x="852" y="514" text-anchor="middle" font-size="11.5" fill="#6a5a90">car is always moving;</text>
    <text x="852" y="531" text-anchor="middle" font-size="11.5" fill="#6a5a90">new requests fold into</text>
    <text x="852" y="546" text-anchor="middle" font-size="11.5" fill="#6a5a90">the NEXT decision</text>
    <text x="852" y="568" text-anchor="middle" font-size="10" fill="#7a6a95" font-style="italic">decide at the last moment</text>
  </g>

  <text x="500" y="604" text-anchor="middle" font-size="11" fill="#8a97a8" font-style="italic">At scale the tree is huge - a learned policy (MCTS / RL) guides which branches to explore first.</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#2f6db0"/></marker>
  </defs>
</svg>
