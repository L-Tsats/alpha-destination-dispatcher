<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" font-family="Segoe UI, Arial, sans-serif">
  <rect width="920" height="620" fill="#f7f9fc"/>
  <text x="460" y="38" text-anchor="middle" font-size="26" font-weight="700" fill="#1a2b4a">Two-Stage Build Plan</text>
  <text x="460" y="62" text-anchor="middle" font-size="14" fill="#5a6b85">Build one section well, then tile it. Same unit, repeated.</text>

  <!-- ============ STAGE 1 ============ -->
  <rect x="40" y="90" width="380" height="420" rx="14" fill="#e6f7f5" stroke="#1aa89a" stroke-width="2.5"/>
  <text x="230" y="122" text-anchor="middle" font-size="20" font-weight="700" fill="#0f766e">STAGE 1 — Single Section</text>
  <text x="230" y="146" text-anchor="middle" font-size="14" fill="#0f766e">4 elevators · 40 floors · no transfers</text>
  <text x="230" y="166" text-anchor="middle" font-size="12.5" fill="#5a6b85" font-style="italic">a complete, shippable product on its own</text>

  <rect x="95" y="190" width="250" height="230" rx="6" fill="#ffffff" stroke="#1aa89a" stroke-width="1.5"/>
  <g stroke="#9fd8d1" stroke-width="1" stroke-dasharray="3 3">
    <line x1="128" y1="200" x2="128" y2="410"/>
    <line x1="188" y1="200" x2="188" y2="410"/>
    <line x1="248" y1="200" x2="248" y2="410"/>
    <line x1="308" y1="200" x2="308" y2="410"/>
  </g>
  <g stroke="#0f766e" stroke-width="1.5" marker-end="url(#tArrow)" marker-start="url(#tArrowS)">
    <line x1="128" y1="250" x2="128" y2="360"/>
    <line x1="188" y1="250" x2="188" y2="360"/>
    <line x1="248" y1="250" x2="248" y2="360"/>
    <line x1="308" y1="250" x2="308" y2="360"/>
  </g>
  <g fill="#1aa89a">
    <rect x="116" y="292" width="24" height="26" rx="3"/>
    <rect x="176" y="256" width="24" height="26" rx="3"/>
    <rect x="236" y="330" width="24" height="26" rx="3"/>
    <rect x="296" y="276" width="24" height="26" rx="3"/>
  </g>
  <g fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">
    <text x="128" y="310">A1</text>
    <text x="188" y="274">B1</text>
    <text x="248" y="348">C1</text>
    <text x="308" y="294">D1</text>
  </g>
  <text x="220" y="406" text-anchor="middle" font-size="11" fill="#5a6b85">one flat bank · one "entrance point"</text>

  <text x="230" y="446" text-anchor="middle" font-size="12.5" fill="#0f766e" font-weight="600">Goal: all mechanical parts work;</text>
  <text x="230" y="464" text-anchor="middle" font-size="12.5" fill="#0f766e" font-weight="600">team + logic get the hang of it.</text>
  <text x="230" y="490" text-anchor="middle" font-size="12" fill="#5a6b85">Models, on point, the behaviour of ONE section.</text>

  <!-- EXTEND arrow -->
  <line x1="430" y1="300" x2="490" y2="300" stroke="#6b4ea8" stroke-width="3" marker-end="url(#pArrow)"/>
  <text x="460" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="#6b4ea8">extend</text>
  <text x="460" y="318" text-anchor="middle" font-size="10.5" fill="#6b4ea8">(tile it)</text>

  <!-- ============ STAGE 2 ============ -->
  <rect x="500" y="90" width="380" height="420" rx="14" fill="#efe9f8" stroke="#6b4ea8" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="690" y="122" text-anchor="middle" font-size="20" font-weight="700" fill="#5a3d99">STAGE 2 — Multi-Section</text>
  <text x="690" y="146" text-anchor="middle" font-size="14" fill="#5a3d99">20 elevators · 200 floors · transfers</text>
  <text x="690" y="166" text-anchor="middle" font-size="12.5" fill="#5a6b85" font-style="italic">same unit, tiled 5× + routing wrapper</text>

  <rect x="560" y="186" width="260" height="238" rx="6" fill="#ffffff" stroke="#6b4ea8" stroke-width="1.5"/>
  <line x1="560" y1="264" x2="820" y2="264" stroke="#6b4ea8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="560" y1="344" x2="820" y2="344" stroke="#6b4ea8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="828" y="268" font-size="9" fill="#6b4ea8">transfer</text>
  <text x="828" y="348" font-size="9" fill="#6b4ea8">transfer</text>

  <text x="572" y="206" font-size="11" font-weight="700" fill="#5a3d99">§3</text>
  <text x="572" y="300" font-size="11" font-weight="700" fill="#5a3d99">§2</text>
  <text x="572" y="384" font-size="11" font-weight="700" fill="#5a3d99">§1</text>

  <g fill="#6b4ea8" font-size="9" text-anchor="middle">
    <rect x="612" y="212" width="22" height="20" rx="3"/><text x="623" y="226" fill="#fff" font-weight="700">A3</text>
    <rect x="662" y="224" width="22" height="20" rx="3"/><text x="673" y="238" fill="#fff" font-weight="700">B3</text>
    <rect x="712" y="212" width="22" height="20" rx="3"/><text x="723" y="226" fill="#fff" font-weight="700">C3</text>
    <rect x="762" y="230" width="22" height="20" rx="3"/><text x="773" y="244" fill="#fff" font-weight="700">D3</text>
    <rect x="612" y="296" width="22" height="20" rx="3"/><text x="623" y="310" fill="#fff" font-weight="700">A2</text>
    <rect x="662" y="308" width="22" height="20" rx="3"/><text x="673" y="322" fill="#fff" font-weight="700">B2</text>
    <rect x="712" y="292" width="22" height="20" rx="3"/><text x="723" y="306" fill="#fff" font-weight="700">C2</text>
    <rect x="762" y="312" width="22" height="20" rx="3"/><text x="773" y="326" fill="#fff" font-weight="700">D2</text>
    <rect x="612" y="378" width="22" height="20" rx="3"/><text x="623" y="392" fill="#fff" font-weight="700">A1</text>
    <rect x="662" y="390" width="22" height="20" rx="3"/><text x="673" y="404" fill="#fff" font-weight="700">B1</text>
    <rect x="712" y="374" width="22" height="20" rx="3"/><text x="723" y="388" fill="#fff" font-weight="700">C1</text>
    <rect x="762" y="392" width="22" height="20" rx="3"/><text x="773" y="406" fill="#fff" font-weight="700">D1</text>
  </g>
  <g stroke="#b9a4dd" stroke-width="1" stroke-dasharray="3 3">
    <line x1="690" y1="194" x2="690" y2="258"/>
    <line x1="690" y1="270" x2="690" y2="338"/>
    <line x1="690" y1="350" x2="690" y2="418"/>
  </g>

  <text x="690" y="446" text-anchor="middle" font-size="12.5" fill="#5a3d99" font-weight="600">Add: split request into legs, ETA per leg,</text>
  <text x="690" y="464" text-anchor="middle" font-size="12.5" fill="#5a3d99" font-weight="600">manage transfer waits ("2-point entrance").</text>
  <text x="690" y="490" text-anchor="middle" font-size="12" fill="#5a6b85">A multi-section travel-optimization wrapper. Team can help by now.</text>

  <!-- ============ EXPLAINER ============ -->
  <rect x="40" y="528" width="840" height="72" rx="10" fill="#fff6e6" stroke="#e0a826" stroke-width="2"/>
  <text x="60" y="552" font-size="13" font-weight="700" fill="#9a6a00">Why split like this? The real mechanical constraint:</text>
  <text x="60" y="572" font-size="12" fill="#7a5a10">In real supertall buildings a single shaft can't span 200 floors — cable weight &amp; travel time make it impractical. Towers are</text>
  <text x="60" y="590" font-size="12" fill="#7a5a10">split into zones (banks) of ~4 cars / ~40 floors, with sky-lobby transfer floors between them. We mirror that: 4:40 is our fixed section unit.</text>

  <defs>
    <marker id="tArrow" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#0f766e"/></marker>
    <marker id="tArrowS" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M7,0 L0,3.5 L7,7 Z" fill="#0f766e"/></marker>
    <marker id="pArrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#6b4ea8"/></marker>
  </defs>
</svg>
