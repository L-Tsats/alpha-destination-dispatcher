<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="600" fill="#f7f9fc"/>
  <text x="500" y="38" text-anchor="middle" font-size="26" font-weight="700" fill="#1a2b4a">Three-Stage Build Plan</text>
  <text x="500" y="62" text-anchor="middle" font-size="14" fill="#5a6b85">Add one axis of complexity at a time. Each stage is a working system.</text>
  <rect x="30" y="90" width="300" height="400" rx="14" fill="#e6f7f5" stroke="#1aa89a" stroke-width="2.5"/>
  <text x="180" y="120" text-anchor="middle" font-size="18" font-weight="700" fill="#0f766e">STAGE 1 — Core logic</text>
  <text x="180" y="143" text-anchor="middle" font-size="13.5" fill="#0f766e">1 elevator · 10 floors</text>
  <text x="180" y="162" text-anchor="middle" font-size="12" fill="#5a6b85" font-style="italic">pure ORDERING (one car)</text>
  <rect x="120" y="185" width="120" height="220" rx="6" fill="#ffffff" stroke="#1aa89a" stroke-width="1.5"/>
  <line x1="180" y1="240" x2="180" y2="350" stroke="#0f766e" stroke-width="1.5" marker-end="url(#tA)" marker-start="url(#tAs)"/>
  <rect x="166" y="285" width="28" height="30" rx="3" fill="#1aa89a"/>
  <text x="180" y="305" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">A</text>
  <text x="180" y="425" text-anchor="middle" font-size="11.5" fill="#5a6b85">Decide the ORDER one car</text>
  <text x="180" y="442" text-anchor="middle" font-size="11.5" fill="#5a6b85">serves its requests.</text>
  <text x="180" y="466" text-anchor="middle" font-size="11" fill="#0f766e" font-weight="600">Tree search + slack + no-stall.</text>
  <line x1="338" y1="290" x2="378" y2="290" stroke="#6b4ea8" stroke-width="3" marker-end="url(#pA)"/>
  <text x="358" y="281" text-anchor="middle" font-size="10" font-weight="700" fill="#6b4ea8">+cars</text>
  <rect x="385" y="90" width="300" height="400" rx="14" fill="#eef4fb" stroke="#2f6db0" stroke-width="2.5"/>
  <text x="535" y="120" text-anchor="middle" font-size="18" font-weight="700" fill="#245a94">STAGE 2 — Assignment</text>
  <text x="535" y="143" text-anchor="middle" font-size="13.5" fill="#245a94">4 elevators · 40 floors</text>
  <text x="535" y="162" text-anchor="middle" font-size="12" fill="#5a6b85" font-style="italic">adds WHICH-CAR (single section)</text>
  <rect x="430" y="185" width="210" height="220" rx="6" fill="#ffffff" stroke="#2f6db0" stroke-width="1.5"/>
  <g fill="#2f6db0">
    <rect x="451" y="300" width="28" height="26" rx="3"/>
    <rect x="499" y="250" width="28" height="26" rx="3"/>
    <rect x="547" y="330" width="28" height="26" rx="3"/>
    <rect x="595" y="270" width="28" height="26" rx="3"/>
  </g>
  <g fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">
    <text x="465" y="318">A</text><text x="513" y="268">B</text>
    <text x="561" y="348">C</text><text x="609" y="288">D</text>
  </g>
  <text x="535" y="425" text-anchor="middle" font-size="11.5" fill="#5a6b85">A wrapper picks WHICH car</text>
  <text x="535" y="442" text-anchor="middle" font-size="11.5" fill="#5a6b85">serves each request...</text>
  <text x="535" y="466" text-anchor="middle" font-size="11" fill="#245a94" font-weight="600">= run Stage-1 ordering per car,</text>
  <text x="535" y="482" text-anchor="middle" font-size="11" fill="#245a94" font-weight="600">pick the best outcome.</text>
  <line x1="693" y1="290" x2="733" y2="290" stroke="#6b4ea8" stroke-width="3" marker-end="url(#pA)"/>
  <text x="713" y="281" text-anchor="middle" font-size="9" font-weight="700" fill="#6b4ea8">+zones</text>
  <rect x="740" y="90" width="235" height="400" rx="14" fill="#efe9f8" stroke="#6b4ea8" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="857" y="120" text-anchor="middle" font-size="17" font-weight="700" fill="#5a3d99">STAGE 3 — Transfers</text>
  <text x="857" y="143" text-anchor="middle" font-size="13" fill="#5a3d99">20 elevators · 200 floors</text>
  <text x="857" y="162" text-anchor="middle" font-size="11.5" fill="#5a6b85" font-style="italic">multi-section + sky-lobby transfers</text>
  <rect x="787" y="185" width="140" height="220" rx="6" fill="#ffffff" stroke="#6b4ea8" stroke-width="1.5"/>
  <line x1="787" y1="258" x2="927" y2="258" stroke="#6b4ea8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="787" y1="332" x2="927" y2="332" stroke="#6b4ea8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="792" y="205" font-size="10" font-weight="700" fill="#5a3d99">§3</text>
  <text x="792" y="300" font-size="10" font-weight="700" fill="#5a3d99">§2</text>
  <text x="792" y="375" font-size="10" font-weight="700" fill="#5a3d99">§1</text>
  <g fill="#6b4ea8" font-size="8" text-anchor="middle">
    <rect x="828" y="210" width="18" height="16" rx="2"/><text x="837" y="222" fill="#fff" font-weight="700">A3</text>
    <rect x="862" y="218" width="18" height="16" rx="2"/><text x="871" y="230" fill="#fff" font-weight="700">B3</text>
    <rect x="896" y="210" width="18" height="16" rx="2"/><text x="905" y="222" fill="#fff" font-weight="700">C3</text>
    <rect x="828" y="284" width="18" height="16" rx="2"/><text x="837" y="296" fill="#fff" font-weight="700">A2</text>
    <rect x="862" y="292" width="18" height="16" rx="2"/><text x="871" y="304" fill="#fff" font-weight="700">B2</text>
    <rect x="896" y="284" width="18" height="16" rx="2"/><text x="905" y="296" fill="#fff" font-weight="700">C2</text>
    <rect x="828" y="358" width="18" height="16" rx="2"/><text x="837" y="370" fill="#fff" font-weight="700">A1</text>
    <rect x="862" y="366" width="18" height="16" rx="2"/><text x="871" y="378" fill="#fff" font-weight="700">B1</text>
    <rect x="896" y="358" width="18" height="16" rx="2"/><text x="905" y="370" fill="#fff" font-weight="700">C1</text>
  </g>
  <text x="857" y="425" text-anchor="middle" font-size="11" fill="#5a6b85">A request becomes LEGS;</text>
  <text x="857" y="441" text-anchor="middle" font-size="11" fill="#5a6b85">chain them, slack per leg.</text>
  <text x="857" y="465" text-anchor="middle" font-size="10.5" fill="#5a3d99" font-weight="600">reuses Stage-1/2 per section.</text>
  <rect x="30" y="510" width="945" height="72" rx="10" fill="#fff6e6" stroke="#e0a826" stroke-width="2"/>
  <text x="50" y="534" font-size="13" font-weight="700" fill="#9a6a00">Why three stages (and why zoning only at Stage 3):</text>
  <text x="50" y="554" font-size="12" fill="#7a5a10">Each stage adds ONE axis of complexity and is a working system on its own. Real towers split into zones (~4 cars / ~40 floors) with</text>
  <text x="50" y="572" font-size="12" fill="#7a5a10">sky-lobby transfers, because cable weight and travel time make one shaft spanning 200 floors impractical. 4:40 is our fixed section unit.</text>
  <defs>
    <marker id="tA" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#0f766e"/></marker>
    <marker id="tAs" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M7,0 L0,3.5 L7,7 Z" fill="#0f766e"/></marker>
    <marker id="pA" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#6b4ea8"/></marker>
  </defs>
</svg>